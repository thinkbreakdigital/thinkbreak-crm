name: CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'deploy')
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy target is configured
        run: |
          if [ -z "${{ vars.SERVER_URL }}" ]; then
            echo "SERVER_URL is not set."
            echo "Set it as a repository variable under Settings > Secrets and variables > Actions > Variables."
            echo "Example: https://crm.example.com"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Deploy
        uses: twentyhq/twenty/.github/actions/deploy-twenty-app@main
        with:
          api-url: ${{ vars.SERVER_URL }}
          api-key: ${{ secrets.TWENTY_DEPLOY_API_KEY }}
