name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy target is configured
        run: |
          if [ -z "${{ vars.TWENTY_DEPLOY_URL }}" ]; then
            echo "TWENTY_DEPLOY_URL is not set."
            echo "Set it as a repository variable under Settings > Secrets and variables > Actions > Variables."
            echo "Example: https://crm.example.com"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Deploy
        uses: twentyhq/twenty/.github/actions/deploy-twenty-app@6da524b8903ec16a3eeea4b2e4a5fb63dbfc1c58 # twenty-sdk 2.37.0
        with:
          api-url: ${{ vars.TWENTY_DEPLOY_URL }}
          api-key: ${{ secrets.TWENTY_DEPLOY_API_KEY }}
