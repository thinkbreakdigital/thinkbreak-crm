name: CI

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

env:
  TWENTY_VERSION: latest

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Spawn Twenty test instance
        id: twenty
        uses: twentyhq/twenty/.github/actions/spawn-twenty-app-dev-test@main
        with:
          twenty-version: ${{ env.TWENTY_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test:unit

      - name: Run integration tests
        run: yarn test
        env:
          TWENTY_API_URL: ${{ steps.twenty.outputs.server-url }}
          TWENTY_API_KEY: ${{ steps.twenty.outputs.api-key }}

      - name: Verify generated core client fields
        run: |
          test -f node_modules/twenty-client-sdk/dist/core/generated/schema.ts
          grep --quiet 'annualizedValue' node_modules/twenty-client-sdk/dist/core/generated/schema.ts
          grep --quiet 'probability' node_modules/twenty-client-sdk/dist/core/generated/schema.ts
          sed -n '/^export interface DealUpdateInput/,/^}$/p' node_modules/twenty-client-sdk/dist/core/generated/schema.ts | grep --quiet 'probability'
          sed -n '/^export interface ProjectUpdateInput/,/^}$/p' node_modules/twenty-client-sdk/dist/core/generated/schema.ts | grep --quiet 'annualizedValue'

      - name: Typecheck generated workspace schema
        run: yarn typecheck
