# Marketplace publishing is not configured for this private, internally deployed
# app. Keep production deployment in cd.yml. If the distribution model changes,
# add the twenty-app package keyword and rebuild this workflow from Twenty's
# current publishing documentation.
name: Publish (not configured)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explain:
    runs-on: ubuntu-latest
    steps:
      - name: Explain publishing status
        run: |
          echo "Marketplace publishing is not configured."
          echo "Use the CD workflow to deploy merged main code to the hosted workspace."
