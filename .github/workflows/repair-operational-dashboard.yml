name: Repair operational dashboard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check repair target is configured
        env:
          API_URL: ${{ vars.TWENTY_DEPLOY_URL }}
          API_KEY: ${{ secrets.TWENTY_DEPLOY_API_KEY }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "TWENTY_DEPLOY_URL is not set."
            exit 1
          fi
          if [ -z "$API_KEY" ]; then
            echo "TWENTY_DEPLOY_API_KEY is not set."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Repair Operational dashboard
        env:
          TWENTY_API_URL: ${{ vars.TWENTY_DEPLOY_URL }}
          TWENTY_API_KEY: ${{ secrets.TWENTY_DEPLOY_API_KEY }}
        run: node scripts/repair-operational-dashboard.mjs
