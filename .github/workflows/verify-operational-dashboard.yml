name: Verify operational dashboard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check verification target is configured
        env:
          API_URL: ${{ vars.TWENTY_DEPLOY_URL }}
          API_KEY: ${{ secrets.TWENTY_DEPLOY_API_KEY }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "TWENTY_DEPLOY_URL is not set."
            exit 1
          fi
          if [ -z "$API_KEY" ]; then
            echo "TWENTY_DEPLOY_API_KEY is not set."
            exit 1
          fi

      - name: Inspect deployed dashboard metadata
        env:
          API_URL: ${{ vars.TWENTY_DEPLOY_URL }}
          API_KEY: ${{ secrets.TWENTY_DEPLOY_API_KEY }}
        run: |
          metadata_url="${API_URL%/}/metadata"
          graphql_url="${API_URL%/}/graphql"
          metadata_request_body="$(node -e 'process.stdout.write(JSON.stringify({query: `
            query InspectDashboardMetadata {
              getPageLayouts(pageLayoutType: DASHBOARD) {
                id
                name
                type
                universalIdentifier
                applicationId
                createdAt
                updatedAt
                deletedAt
                tabs {
                  id
                  universalIdentifier
                  title
                  icon
                  position
                  layoutMode
                  isActive
                  deletedAt
                  widgets {
                    id
                    applicationId
                    universalIdentifier
                    title
                    type
                    objectMetadataId
                    createdAt
                    updatedAt
                    isActive
                    deletedAt
                    gridPosition {
                      row
                      column
                      rowSpan
                      columnSpan
                    }
                    position {
                      __typename
                      ... on PageLayoutWidgetGridPosition {
                        layoutMode
                        row
                        column
                        rowSpan
                        columnSpan
                      }
                      ... on PageLayoutWidgetVerticalListPosition {
                        layoutMode
                        index
                      }
                      ... on PageLayoutWidgetCanvasPosition {
                        layoutMode
                      }
                    }
                    configuration {
                      __typename
                      ... on RecordTableConfiguration {
                        configurationType
                        viewId
                        recordLimit
                      }
                      ... on AggregateChartConfiguration {
                        configurationType
                        aggregateFieldMetadataId
                        aggregateOperation
                        label
                        displayDataLabel
                        numberFormat
                        description
                        filter
                        prefix
                        suffix
                      }
                      ... on BarChartConfiguration {
                        configurationType
                        aggregateFieldMetadataId
                        aggregateOperation
                        primaryAxisGroupByFieldMetadataId
                        primaryAxisGroupBySubFieldName
                        primaryAxisDateGranularity
                        primaryAxisOrderBy
                        primaryAxisManualSortOrder
                        secondaryAxisGroupByFieldMetadataId
                        secondaryAxisGroupBySubFieldName
                        secondaryAxisGroupByDateGranularity
                        secondaryAxisOrderBy
                        secondaryAxisManualSortOrder
                        omitNullValues
                        axisNameDisplay
                        displayDataLabel
                        displayLegend
                        numberFormat
                        rangeMin
                        rangeMax
                        color
                        description
                        filter
                        groupMode
                        layout
                        isCumulative
                        splitMultiValueFields
                      }
                      ... on LineChartConfiguration {
                        configurationType
                        aggregateFieldMetadataId
                        aggregateOperation
                        primaryAxisGroupByFieldMetadataId
                        primaryAxisGroupBySubFieldName
                        primaryAxisDateGranularity
                        primaryAxisOrderBy
                        primaryAxisManualSortOrder
                        secondaryAxisGroupByFieldMetadataId
                        secondaryAxisGroupBySubFieldName
                        secondaryAxisGroupByDateGranularity
                        secondaryAxisOrderBy
                        secondaryAxisManualSortOrder
                        omitNullValues
                        axisNameDisplay
                        displayDataLabel
                        displayLegend
                        numberFormat
                        rangeMin
                        rangeMax
                        color
                        description
                        filter
                        isStacked
                        isCumulative
                        splitMultiValueFields
                      }
                      ... on PieChartConfiguration {
                        configurationType
                        groupByFieldMetadataId
                        aggregateFieldMetadataId
                        aggregateOperation
                        groupBySubFieldName
                        dateGranularity
                        orderBy
                        manualSortOrder
                        displayDataLabel
                        showCenterMetric
                        displayLegend
                        numberFormat
                        hideEmptyCategory
                        splitMultiValueFields
                        color
                        description
                        filter
                      }
                    }
                  }
                }
              }
              getViews {
                id
                universalIdentifier
                applicationId
                name
                objectMetadataId
                type
                isCustom
                isActive
                deletedAt
                viewFilters {
                  id
                  fieldMetadataId
                  operand
                  value
                  subFieldName
                  viewFilterGroupId
                  positionInViewFilterGroup
                  relationTargetFieldMetadataId
                }
                viewSorts {
                  id
                  fieldMetadataId
                  direction
                  subFieldName
                }
                viewGroups {
                  id
                  fieldValue
                  position
                  isVisible
                }
              }
              objects(paging: { first: 100 }, filter: {}) {
                edges {
                  node {
                    id
                    universalIdentifier
                    nameSingular
                    labelSingular
                    fieldsList {
                      id
                      universalIdentifier
                      name
                      label
                      type
                      options
                    }
                  }
                }
              }
            }
          `}));')"
          core_request_body="$(node -e 'process.stdout.write(JSON.stringify({query: `
            query InspectDashboards {
              dashboards {
                edges {
                  node {
                    id
                    title
                    pageLayoutId
                    position
                    createdAt
                    updatedAt
                  }
                }
              }
            }
          `}));')"
          metadata_response_file="$RUNNER_TEMP/dashboard-metadata-response.json"
          core_response_file="$RUNNER_TEMP/dashboard-core-response.json"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $API_KEY" \
            --header 'Content-Type: application/json' \
            --data "$metadata_request_body" \
            --output "$metadata_response_file" \
            "$metadata_url"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $API_KEY" \
            --header 'Content-Type: application/json' \
            --data "$core_request_body" \
            --output "$core_response_file" \
            "$graphql_url"
          node - "$metadata_response_file" "$core_response_file" <<'NODE'
            const fs = require('node:fs');

            const parseResponse = (label, rawResponse) => {
              const response = JSON.parse(rawResponse);

              if (response.errors?.length) {
                throw new Error(`${label}: ${response.errors.map((error) => error.message).join('; ')}`);
              }

              return response.data;
            };

            const metadata = parseResponse(
              'Metadata API',
              fs.readFileSync(process.argv[2], 'utf8'),
            );
            const core = parseResponse(
              'Core API',
              fs.readFileSync(process.argv[3], 'utf8'),
            );
            const dashboards = core.dashboards.edges.map(({ node }) => node);
            const objects = metadata.objects.edges.map(({ node }) => node);
            const objectById = new Map(objects.map((object) => [object.id, object]));
            const fieldById = new Map(
              objects.flatMap((object) =>
                object.fieldsList.map((field) => [field.id, { ...field, object: object.nameSingular }]),
              ),
            );
            const viewById = new Map(metadata.getViews.map((view) => [view.id, view]));
            const resolveField = (id) => id ? fieldById.get(id) ?? { id } : null;
            const resolvedViews = metadata.getViews.map((view) => ({
              ...view,
              object: objectById.get(view.objectMetadataId)?.nameSingular ?? view.objectMetadataId,
              viewFilters: view.viewFilters.map((filter) => ({
                ...filter,
                field: resolveField(filter.fieldMetadataId),
              })),
              viewSorts: view.viewSorts.map((sort) => ({
                ...sort,
                field: resolveField(sort.fieldMetadataId),
              })),
            }));
            const layouts = metadata.getPageLayouts.map((layout) => ({
              ...layout,
              tabs: layout.tabs.map((tab) => ({
                ...tab,
                widgets: tab.widgets.map((widget) => {
                  const configuration = widget.configuration;
                  const view = configuration?.viewId ? viewById.get(configuration.viewId) : null;

                  return {
                    ...widget,
                    object: objectById.get(widget.objectMetadataId)?.nameSingular ?? widget.objectMetadataId,
                    configuration: configuration
                      ? {
                          ...configuration,
                          view: view
                            ? {
                                id: view.id,
                                universalIdentifier: view.universalIdentifier,
                                name: view.name,
                                objectMetadataId: view.objectMetadataId,
                              }
                            : null,
                          aggregateField: resolveField(configuration.aggregateFieldMetadataId),
                          primaryAxisGroupByField: resolveField(
                            configuration.primaryAxisGroupByFieldMetadataId,
                          ),
                          secondaryAxisGroupByField: resolveField(
                            configuration.secondaryAxisGroupByFieldMetadataId,
                          ),
                          groupByField: resolveField(configuration.groupByFieldMetadataId),
                        }
                      : null,
                  };
                }),
              })),
            }));

            console.log(JSON.stringify({ dashboards, layouts, views: resolvedViews }, null, 2));
          NODE

      - name: Diagnose deployed Project annualized values
        env:
          API_URL: ${{ vars.TWENTY_DEPLOY_URL }}
          API_KEY: ${{ secrets.TWENTY_DEPLOY_API_KEY }}
        run: |
          metadata_url="${API_URL%/}/metadata"
          graphql_url="${API_URL%/}/graphql"
          metadata_request_body="$(node -e 'process.stdout.write(JSON.stringify({query: `
            query InspectAnnualizedValueFunctions {
              findManyLogicFunctions {
                id
                name
                universalIdentifier
                applicationId
                executionMode
                databaseEventTriggerSettings
                createdAt
                updatedAt
              }
            }
          `}));')"
          project_request_body="$(node -e 'process.stdout.write(JSON.stringify({query: `
            query InspectProjectAnnualizedValues {
              projects {
                edges {
                  node {
                    billingType
                    value {
                      amountMicros
                      currencyCode
                    }
                    annualizedValue {
                      amountMicros
                      currencyCode
                    }
                    createdAt
                    updatedAt
                  }
                }
              }
            }
          `}));')"
          logs_request_body="$(node -e 'process.stdout.write(JSON.stringify({query: `
            query InspectAnnualizedValueFunctionLogs {
              eventLogs(input: { table: APPLICATION_LOG, first: 100 }) {
                totalCount
                records {
                  event
                  timestamp
                  properties
                  recordId
                  objectMetadataId
                }
              }
            }
          `}));')"
          metadata_response_file="$RUNNER_TEMP/annualized-value-metadata-response.json"
          project_response_file="$RUNNER_TEMP/annualized-value-project-response.json"
          logs_response_file="$RUNNER_TEMP/annualized-value-logs-response.json"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $API_KEY" \
            --header 'Content-Type: application/json' \
            --data "$metadata_request_body" \
            --output "$metadata_response_file" \
            "$metadata_url"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $API_KEY" \
            --header 'Content-Type: application/json' \
            --data "$project_request_body" \
            --output "$project_response_file" \
            "$graphql_url"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $API_KEY" \
            --header 'Content-Type: application/json' \
            --data "$logs_request_body" \
            --output "$logs_response_file" \
            "$metadata_url"
          node - "$metadata_response_file" "$project_response_file" "$logs_response_file" <<'NODE'
            const fs = require('node:fs');

            const parseResponse = (label, responsePath) => {
              const response = JSON.parse(fs.readFileSync(responsePath, 'utf8'));

              if (response.errors?.length) {
                throw new Error(`${label}: ${response.errors.map((error) => error.message).join('; ')}`);
              }

              return response.data;
            };

            const metadata = parseResponse('Metadata API', process.argv[2]);
            const core = parseResponse('Core API', process.argv[3]);
            const logsResponse = JSON.parse(fs.readFileSync(process.argv[4], 'utf8'));
            const annualizedFunctionUniversalIdentifiers = new Set([
              '0d404833-c72e-48cb-ad09-f03573d1bc13',
              'd15abb48-1fbe-4850-afa9-3480929b9112',
            ]);
            const logicFunctions = metadata.findManyLogicFunctions.filter((logicFunction) =>
              annualizedFunctionUniversalIdentifiers.has(logicFunction.universalIdentifier),
            );
            const firstFunctionCreatedAt = logicFunctions
              .map((logicFunction) => logicFunction.createdAt)
              .sort()[0] ?? null;
            const projects = core.projects.edges.map(({ node }) => node);
            const projectAudit = {
              sampledProjects: projects.length,
              missingInputs: 0,
              expectedValuePresent: 0,
              expectedValueMissing: 0,
              mismatchedValue: 0,
              expectedValueMissingCreatedBeforeFunction: 0,
              expectedValueMissingCreatedAfterFunction: 0,
              expectedValueMissingUpdatedAfterFunction: 0,
              emptyAnnualizedComposite: 0,
              amountMismatch: 0,
              currencyMismatch: 0,
              observedMultiplierCounts: {},
              missingAnnualizedProjects: [],
            };

            for (const project of projects) {
              if (!project.billingType || !project.value) {
                projectAudit.missingInputs += 1;
                continue;
              }

              const multiplier = project.billingType === 'RECURRING'
                ? 12
                : project.billingType === 'SINGULAR'
                  ? 1
                  : null;

              if (multiplier === null) {
                projectAudit.mismatchedValue += 1;
                continue;
              }

              if (
                !project.annualizedValue ||
                project.annualizedValue.amountMicros == null ||
                !project.annualizedValue.currencyCode
              ) {
                projectAudit.expectedValueMissing += 1;

                if (project.annualizedValue) {
                  projectAudit.emptyAnnualizedComposite += 1;
                }

                if (firstFunctionCreatedAt && project.createdAt < firstFunctionCreatedAt) {
                  projectAudit.expectedValueMissingCreatedBeforeFunction += 1;
                } else if (firstFunctionCreatedAt) {
                  projectAudit.expectedValueMissingCreatedAfterFunction += 1;
                }

                if (firstFunctionCreatedAt && project.updatedAt > firstFunctionCreatedAt) {
                  projectAudit.expectedValueMissingUpdatedAfterFunction += 1;
                }

                projectAudit.missingAnnualizedProjects.push({
                  billingType: project.billingType,
                  createdAt: project.createdAt,
                  updatedAt: project.updatedAt,
                  sourceAmountPresent: project.value.amountMicros != null,
                  sourceCurrencyPresent: Boolean(project.value.currencyCode),
                  annualizedCompositePresent: Boolean(project.annualizedValue),
                  annualizedAmountPresent: project.annualizedValue?.amountMicros != null,
                  annualizedCurrencyPresent: Boolean(project.annualizedValue?.currencyCode),
                });

                continue;
              }

              const expectedAmountMicros = Number(project.value.amountMicros) * multiplier;
              const amountMatches =
                Number(project.annualizedValue.amountMicros) === expectedAmountMicros;
              const currencyMatches =
                project.annualizedValue.currencyCode === project.value.currencyCode;
              const observedMultiplier = Number(project.value.amountMicros) === 0
                ? 'source-zero'
                : String(
                    Number(project.annualizedValue.amountMicros) /
                      Number(project.value.amountMicros),
                  );
              projectAudit.observedMultiplierCounts[observedMultiplier] =
                (projectAudit.observedMultiplierCounts[observedMultiplier] ?? 0) + 1;

              if (amountMatches && currencyMatches) {
                projectAudit.expectedValuePresent += 1;
              } else {
                projectAudit.mismatchedValue += 1;

                if (!amountMatches) {
                  projectAudit.amountMismatch += 1;
                }

                if (!currencyMatches) {
                  projectAudit.currencyMismatch += 1;
                }
              }
            }

            const sanitizeLogValue = (value) => {
              return JSON.stringify(value)
                .replace(
                  /[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/gi,
                  '[UUID]',
                )
                .replace(/https?:\/\/[^\s"']+/gi, '[URL]')
                .replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi, '[EMAIL]')
                .replace(/\b\d{5,}\b/g, '[NUMBER]');
            };
            const logicFunctionLogSummary = logsResponse.errors?.length
              ? { queryErrors: logsResponse.errors.map((error) => error.message) }
              : {
                  totalApplicationLogs: logsResponse.data?.eventLogs?.totalCount ?? null,
                  matchingLogs: (logsResponse.data?.eventLogs?.records ?? [])
                    .filter((record) =>
                      /annualized|error|fail|forbidden|permission|updateProject/i.test(
                        JSON.stringify(record),
                      ),
                    )
                    .slice(-30)
                    .map((record) => ({
                      event: record.event,
                      timestamp: record.timestamp,
                      details: sanitizeLogValue(record.properties),
                    })),
                };

            console.log(
              JSON.stringify({ logicFunctions, projectAudit, logicFunctionLogSummary }, null, 2),
            );
          NODE

      - name: Verify Operational dashboard metadata and record
        env:
          API_URL: ${{ vars.TWENTY_DEPLOY_URL }}
          API_KEY: ${{ secrets.TWENTY_DEPLOY_API_KEY }}
        run: |
          metadata_url="${API_URL%/}/metadata"
          graphql_url="${API_URL%/}/graphql"
          metadata_request_body="$(node -e 'process.stdout.write(JSON.stringify({query: `
            query VerifyOperationalDashboardLayout {
              getPageLayouts(pageLayoutType: DASHBOARD) {
                id
                universalIdentifier
                name
                type
                tabs {
                  universalIdentifier
                  title
                  position
                  layoutMode
                  isActive
                  deletedAt
                  widgets {
                    universalIdentifier
                    title
                    type
                    isActive
                    deletedAt
                    position {
                      __typename
                      ... on PageLayoutWidgetGridPosition {
                        layoutMode
                        row
                        column
                        rowSpan
                        columnSpan
                      }
                    }
                    gridPosition {
                      row
                      column
                      rowSpan
                      columnSpan
                    }
                    configuration {
                      __typename
                      ... on RecordTableConfiguration {
                        configurationType
                        viewId
                        recordLimit
                      }
                    }
                  }
                }
              }
              getViews {
                id
                universalIdentifier
                name
              }
            }
          `}));')"
          metadata_response="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $API_KEY" \
            --header 'Content-Type: application/json' \
            --data "$metadata_request_body" \
            "$metadata_url")"
          core_request_body="$(node -e 'process.stdout.write(JSON.stringify({query: `query { dashboard(filter: { id: { eq: "9fc9c362-a362-4079-814d-268fcd9436c7" } }) { id title pageLayoutId } }`}));')"
          core_response="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $API_KEY" \
            --header 'Content-Type: application/json' \
            --data "$core_request_body" \
            "$graphql_url")"
          node - "$metadata_response" "$core_response" <<'NODE'
            const parseResponse = (label, rawResponse) => {
              let response;

              try {
                response = JSON.parse(rawResponse);
              } catch {
                throw new Error(`${label} returned invalid JSON.`);
              }

              if (response.errors?.length) {
                const details = response.errors
                  .map((error) => {
                    const code = error.extensions?.code;
                    return code ? `${code}: ${error.message}` : error.message;
                  })
                  .join('; ');
                throw new Error(`${label} returned GraphQL errors: ${details}`);
              }

              if (!response.data) {
                throw new Error(`${label} returned no data.`);
              }

              return response.data;
            };

            const metadata = parseResponse('Twenty Metadata API', process.argv[2]);
            const core = parseResponse('Twenty Core API', process.argv[3]);
            const expectedLayoutUniversalIdentifier =
              'e6b870c6-4f89-4b4e-9d64-8b8c91a9202a';
            if (!Array.isArray(metadata.getPageLayouts)) {
              throw new Error('Twenty Metadata API did not expose page layouts.');
            }

            const layouts = metadata.getPageLayouts.filter(
              (candidate) =>
                candidate.universalIdentifier === expectedLayoutUniversalIdentifier &&
                candidate.type === 'DASHBOARD',
            );

            if (layouts.length !== 1) {
              throw new Error(
                `Expected one packaged Operational dashboard layout, found ${layouts.length}.`,
              );
            }

            const layout = layouts[0];
            if (layout.name !== 'Operational dashboard') {
              throw new Error(`Operational dashboard layout name was ${JSON.stringify(layout.name)}.`);
            }
            if (!Array.isArray(layout.tabs)) {
              throw new Error('Twenty Metadata API did not expose page layout tabs.');
            }

            const activeTabs = layout.tabs.filter(
              (tab) => tab.isActive !== false && tab.deletedAt == null,
            );
            if (activeTabs.length !== 1) {
              throw new Error(
                `Expected one active Operational dashboard tab, found ${activeTabs.length}.`,
              );
            }

            const tab = activeTabs[0];
            if (
              tab.universalIdentifier !== 'b38f26fe-d6a2-4483-9f63-1f871569072e' ||
              tab.title !== 'Overview' ||
              tab.position !== 0 ||
              tab.layoutMode !== 'GRID'
            ) {
              throw new Error(`Operational dashboard tab metadata did not match: ${JSON.stringify(tab)}.`);
            }
            if (!Array.isArray(tab.widgets)) {
              throw new Error('Twenty Metadata API did not expose page layout widgets.');
            }

            const expectedWidgets = [
              {
                universalIdentifier: '1b145e2f-dd15-43e5-a8a0-c388f72a92c1',
                title: 'Open Deals',
                viewUniversalIdentifier: '48120c6b-2448-4d91-83b3-11adc82a43fa',
                position: { row: 0, column: 0, rowSpan: 1, columnSpan: 1 },
              },
              {
                universalIdentifier: '4e9cd6d2-c687-481e-970a-cdd01f48d574',
                title: 'Active Projects',
                viewUniversalIdentifier: '532b5e98-8ce9-46dd-9e78-53fe9f58e83b',
                position: { row: 0, column: 1, rowSpan: 1, columnSpan: 1 },
              },
              {
                universalIdentifier: '9362c0bf-5d94-441f-9bd0-2e0f2a8de7c4',
                title: 'Overdue follow-ups',
                viewUniversalIdentifier: 'aea51fbe-767e-4dcd-97ad-964fa510a739',
                position: { row: 1, column: 0, rowSpan: 1, columnSpan: 1 },
              },
              {
                universalIdentifier: '35b659a8-69a3-49c2-8b44-edf8e451eb5b',
                title: 'Data quality',
                viewUniversalIdentifier: 'eab1d547-2f91-4f8d-a555-3bf84d674dd9',
                position: { row: 1, column: 1, rowSpan: 1, columnSpan: 1 },
              },
            ];
            const activeWidgets = tab.widgets.filter(
              (widget) => widget.isActive !== false && widget.deletedAt == null,
            );

            if (activeWidgets.length !== expectedWidgets.length) {
              throw new Error(
                `Expected ${expectedWidgets.length} active Operational dashboard widgets, found ${activeWidgets.length}.`,
              );
            }

            if (!Array.isArray(metadata.getViews)) {
              throw new Error('Twenty Metadata API did not expose saved views.');
            }

            const viewsByUniversalIdentifier = new Map(
              metadata.getViews.map((view) => [view.universalIdentifier, view]),
            );

            for (const expected of expectedWidgets) {
              const widget = activeWidgets.find(
                (candidate) => candidate.universalIdentifier === expected.universalIdentifier,
              );
              if (!widget) {
                throw new Error(`Dashboard widget ${expected.title} was not found.`);
              }

              const runtimeView = viewsByUniversalIdentifier.get(expected.viewUniversalIdentifier);
              if (!runtimeView) {
                throw new Error(`Packaged view for ${expected.title} was not found.`);
              }

              const position = widget.position?.__typename === 'PageLayoutWidgetGridPosition'
                ? widget.position
                : widget.gridPosition;
              const positionMatches =
                position &&
                position.row === expected.position.row &&
                position.column === expected.position.column &&
                position.rowSpan === expected.position.rowSpan &&
                position.columnSpan === expected.position.columnSpan;
              const configuration = widget.configuration;

              if (
                widget.title !== expected.title ||
                widget.type !== 'RECORD_TABLE' ||
                !positionMatches ||
                configuration?.__typename !== 'RecordTableConfiguration' ||
                configuration.configurationType !== 'RECORD_TABLE' ||
                configuration.recordLimit !== 10 ||
                configuration.viewId !== runtimeView.id
              ) {
                throw new Error(
                  `Dashboard widget ${expected.title} metadata did not match: ${JSON.stringify(widget)}.`,
                );
              }
            }

            const dashboard = core.dashboard;
            if (!dashboard) {
              throw new Error('Operational dashboard record was not found.');
            }
            if (dashboard.id !== '9fc9c362-a362-4079-814d-268fcd9436c7') {
              throw new Error('Operational dashboard record ID did not match.');
            }
            if (dashboard.title !== 'Operational dashboard') {
              throw new Error('Operational dashboard title did not match.');
            }
            if (dashboard.pageLayoutId !== layout.id) {
              throw new Error(
                `Operational dashboard record points to ${JSON.stringify(dashboard.pageLayoutId)}, expected ${layout.id}.`,
              );
            }
            console.log(
              JSON.stringify({
                dashboard,
                layoutUniversalIdentifier: layout.universalIdentifier,
                widgets: activeWidgets.map((widget) => widget.title),
              }),
            );
          NODE
